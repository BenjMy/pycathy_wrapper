name: Docs
on:
  push:
    branches: [main]        # use your default branch name
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ... your install + ipykernel steps unchanged ...

      - name: Debug environment
        run: |
          which python
          python --version
          python -m pip list | grep -i -E "sphinx|nbsphinx|ipykernel"
          
      - name: Sphinx build
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gfortran liblapack-dev libblas-dev
          export DISPLAY=:99.0
          export PYVISTA_OFF_SCREEN=true
          export PYVISTA_USE_IPYVTK=true
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
          rm -rf doc/_build/
          python -m sphinx -b html doc doc/_build
          
      - name: Check build output
        run: test -f doc/_build/index.html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/_build/
