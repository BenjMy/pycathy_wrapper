# Build the pyCATHY documentation and publish it to GitHub Pages (gh-pages branch)
name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gfortran liblapack-dev libblas-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sphinx sphinx_book_theme ipykernel
          python -m pip install -r env/requirements_doc.txt
          python -m pip install .

      - name: Register ipykernel
        run: python -m ipykernel install --user --name pycathy_doc

      - name: Check environment
        run: |
          which python
          python --version
          python -m pip list | grep -i -E "sphinx|nbsphinx|ipykernel" || echo "NOT FOUND"
          python -c "import sphinx; print('sphinx', sphinx.__version__)"

      - name: Sphinx build
        env:
          PYVISTA_OFF_SCREEN: "true"
          PYVISTA_USE_IPYVTK: "true"
        run: |
          rm -rf doc/_build/
          # xvfb-run provides a virtual display for pyvista on the headless runner.
          # No "|| true": a failed build must fail the job.
          xvfb-run -a python -m sphinx -b html doc doc/_build

      - name: Check build output
        run: |
          ls -la doc/_build | head -n 30
          test -f doc/_build/index.html

      - name: Deploy to GitHub Pages
        # Only publish from the default branch, never from PRs or feature branches.
        # Change 'main' if your default branch has another name.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/_build
