# Build the CATHY Fortran code with the conda-provided compiler on every platform
name: Fortran build (conda)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 (Apple Silicon) is not supported by this account's runners: untested
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: pycathy-ci

      - name: Install compiler and algebra libraries from conda (no system packages)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # conda-forge's `fortran-compiler` is flang on win-64, which rejects the
            # gfortran extensions used by the CATHY sources (ACCESS='transparent').
            conda install -y gfortran_win-64 libblas liblapack pytest
          else
            conda install -y fortran-compiler libblas liblapack pytest
          fi
          pip install -r env/requirements.txt
          pip install .

      - name: List BLAS/LAPACK libraries installed by conda (Windows diagnostics)
        if: runner.os == 'Windows'
        run: |
          ls "$CONDA_PREFIX/Library/lib" | grep -i -E "blas|lapack|mkl_rt|mkl_core|openblas" || true
          ls "$CONDA_PREFIX/Library/bin" | grep -i -E "blas|lapack|mkl_rt" || true

      - name: Fortran build tests
        run: |
          mkdir -p tmp-fortran-test && cd tmp-fortran-test
          MPLBACKEND=agg pytest --pyargs pyCATHY.tests.test_fortran_build -v

      - name: Build the preprocessor and CATHY (Weill example sources) with conda gfortran + LAPACK/BLAS
        env:
          PYCATHY_CACHE: ${{ runner.temp }}/pycathy-cache
        run: |
          python - <<'EOF'
          import os, shutil, tempfile
          from pathlib import Path
          from pyCATHY import fortran_build as fb

          prj = Path(os.environ["GITHUB_WORKSPACE"]) / "pyCATHY/tests/weil_exemple/my_cathy_prj"
          work = Path(tempfile.mkdtemp())
          shutil.copytree(prj / "src", work / "src")
          shutil.copytree(prj / "prepro" / "src", work / "prepro_src")
          print("compiler:", fb.find_fortran_compiler())
          c = fb.find_fortran_compiler()
          print("flags:", fb.default_compile_flags(compiler=c), fb.link_libraries(compiler=c))

          pre = fb.build_preprocessor(work / "prepro_src")
          assert pre.ok, pre.report()
          cathy = fb.build_cathy(work / "src")
          assert cathy.ok, cathy.report()
          assert cathy.exe.exists()
          again = fb.build_cathy(work / "src")
          assert again.ok and again.from_cache, "second build should be a cache hit"
          print("OK", cathy.exe)
          EOF
